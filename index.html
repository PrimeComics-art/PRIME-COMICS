<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prime Comics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFD400;
  --bg:#000;--ink:#121212;--line:#2a2a2a;--soft:rgba(255,255,255,.22);--text:#f2f2f2;--muted:#a3a3a3;--ay:#FFD400;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{color-scheme:light;--bg:#fff;--ink:#f4f4f4;--line:#111;--soft:rgba(0,0,0,.25);--text:#111;--muted:#444;--ay:#000}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16.5px/1.65 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:31}
a{color:inherit}
:focus-visible{outline:3px solid var(--ay);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:clamp(44px,9vw,80px);margin-bottom:22px}
h3{font-size:30px}
p{margin:0 0 14px;max-width:62ch}
section{padding:72px 0}
.eyebrow{font:600 15px var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
